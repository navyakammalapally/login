<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<style>
body{
    font-family: Arial;
    background-color:whitesmoke;
}

.container{
    width:300px;
    margin:100px auto;
    padding:20px;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px gray;
}

input{
    width:100%;
    padding:8px;
    margin:8px 0;
}

button{
    width:100%;
    padding:10px;
    background:black;
    color:white;
    border:none;
    border-radius:5px;
}
</style>
</head>

<body>

<div class="container">
<h2>Login</h2>

<form onsubmit="return loginUser()">

<label>Email</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
